<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>READ ME (가칭)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 게임 화면(960×540)과 같은 크기의 틀. 메뉴를 그 위에 겹친다 */
      #stage {
        position: relative;
        width: 960px;
        height: 540px;
      }
      #pause-button {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 32px;
        height: 32px;
        border: 1.5px solid #000;
        background: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      #pause-menu,
      #result-screen {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #pause-menu[hidden],
      #result-screen[hidden] {
        display: none;
      }
      #pause-menu h2,
      #result-screen h2 {
        margin: 0 0 8px;
        letter-spacing: 0.2em;
      }
      #pause-menu button,
      #result-screen button {
        width: 220px;
        padding: 10px;
        border: 1.5px solid #000;
        background: #fff;
        font-size: 15px;
        cursor: pointer;
      }
      #pause-menu button:hover,
      #result-screen button:hover {
        background: #000;
        color: #fff;
      }
      #result-screen h2 {
        font-family: ui-monospace, monospace;
        letter-spacing: 0.25em;
      }
      #result-subtitle {
        margin: 0 0 8px;
        color: #555;
        font-size: 14px;
      }
      #controls {
        margin-top: 12px;
        border-collapse: collapse;
        font-size: 13px;
      }
      #controls td {
        padding: 3px 10px;
      }
      #controls td:first-child {
        text-align: right;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>
      <button id="pause-button" title="일시정지 (ESC)" aria-label="일시정지">II</button>
      <div id="pause-menu" hidden>
        <h2>일시정지</h2>
        <button id="resume-button">계속하기 (ESC)</button>
        <button id="restart-button">처음부터 다시 (R)</button>
        <table id="controls">
          <tr><td>WASD</td><td>이동</td></tr>
          <tr><td>마우스</td><td>조준</td></tr>
          <tr><td>좌클릭</td><td>공격 (꾹 누르면 연속, 3타 = 한 바퀴 베기)</td></tr>
          <tr><td>우클릭</td><td>패링</td></tr>
          <tr><td>Space</td><td>대시 (1·2타 후반에 캔슬 가능)</td></tr>
          <tr><td>대시 + 좌클릭</td><td>대시 찌르기</td></tr>
          <tr><td>Q</td><td>포션</td></tr>
          <tr><td>ESC / R</td><td>일시정지 / 재시작</td></tr>
        </table>
      </div>
      <div id="result-screen" hidden>
        <h2 id="result-title"></h2>
        <p id="result-subtitle"></p>
        <button id="result-restart">다시 시작 (R)</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
