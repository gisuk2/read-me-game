# main 브랜치에 푸시하면 테스트 → 빌드 → GitHub Pages 배포를 자동으로 실행한다.
# 사전 설정: 저장소 Settings → Pages → Source를 "GitHub Actions"로 지정.
# actions 버전: Node.js 24 런타임을 쓰는 메이저 버전 (2026-11-07 각 저장소 릴리스 노트로 확인)
#   - upload-pages-artifact v5와 deploy-pages v5는 함께 올려야 호환된다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
