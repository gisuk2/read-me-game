# main 브랜치에 푸시하면 테스트 → 빌드 → GitHub Pages 배포를 자동으로 실행한다.
# 사전 설정: 저장소 Settings → Pages → Source를 "GitHub Actions"로 지정.
# 주의: 아래 actions의 버전은 작성 시점 기준 추정이다. 첫 실행에서 경고가 나오면 최신 메이저 버전으로 올린다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
